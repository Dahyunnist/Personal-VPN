name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject credentials and generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'; then
            echo 'Private key material must not be committed.' >&2
            exit 1
          fi
          forbidden=$(git ls-files | grep -E '(^|/)(out|build)/|\.(key|pem|p12|pfx|exe|dll|log)$|(^|/)config\.json$' || true)
          if [[ -n "$forbidden" ]]; then
            echo 'Generated or credential files are tracked:' >&2
            echo "$forbidden" >&2
            exit 1
          fi
      - name: Test release checksum verifier
        run: python3 tests/test_verify_release_checksums.py

  linux:
    name: Linux ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libboost-dev libssl-dev
      - name: Configure
        run: >-
          cmake -S . -B out/ci-linux-${{ matrix.build_type }} -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPERSONAL_VPN_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build out/ci-linux-${{ matrix.build_type }} --parallel 2
      - name: Test
        run: ctest --test-dir out/ci-linux-${{ matrix.build_type }} --output-on-failure --timeout 30
      - name: Verify install
        if: matrix.build_type == 'Release'
        run: |
          cmake --install out/ci-linux-Release --prefix "$RUNNER_TEMP/personal-vpn"
          "$RUNNER_TEMP/personal-vpn/bin/personal-vpn-server" --help >/dev/null

  windows:
    name: Windows core ${{ matrix.build_type }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B out/ci-windows -A x64
          -DPERSONAL_VPN_WARNINGS_AS_ERRORS=ON
      - name: Build
        shell: pwsh
        run: cmake --build out/ci-windows --config ${{ matrix.build_type }} --parallel 2
      - name: Test
        shell: pwsh
        run: ctest --test-dir out/ci-windows -C ${{ matrix.build_type }} --output-on-failure --timeout 30

  sanitizers:
    name: Clang ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang ninja-build libboost-dev libssl-dev
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B out/ci-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DPERSONAL_VPN_ENABLE_SANITIZERS=ON
          -DPERSONAL_VPN_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build out/ci-sanitized --parallel 2
      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir out/ci-sanitized --output-on-failure --timeout 45

  fuzz:
    name: Protocol fuzz smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang ninja-build
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B out/ci-fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPERSONAL_VPN_BUILD_LINUX_TRANSPORT=OFF
          -DPERSONAL_VPN_BUILD_CLIENT_TRANSPORT=OFF
          -DPERSONAL_VPN_BUILD_TESTS=OFF
          -DPERSONAL_VPN_BUILD_FUZZING=ON
      - name: Build
        run: cmake --build out/ci-fuzz --parallel 2
      - name: Fuzz frame and control decoders
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          mkdir -p out/ci-fuzz/corpus
          out/ci-fuzz/frame-decoder-fuzz \
            -dict=fuzz/protocol.dict \
            -max_total_time=20 \
            -timeout=5 \
            out/ci-fuzz/corpus

  benchmark:
    name: Reproducible protocol benchmark
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build
      - name: Configure
        run: >-
          cmake -S . -B out/ci-benchmark -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPERSONAL_VPN_BUILD_LINUX_TRANSPORT=OFF
          -DPERSONAL_VPN_BUILD_CLIENT_TRANSPORT=OFF
          -DPERSONAL_VPN_BUILD_TESTS=OFF
          -DPERSONAL_VPN_BUILD_BENCHMARKS=ON
          -DPERSONAL_VPN_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build out/ci-benchmark --parallel 2
      - name: Run benchmark
        shell: bash
        run: |
          set -euo pipefail
          out/ci-benchmark/protocol-benchmark 200000 | tee protocol-benchmark.json
          python3 - <<'PY'
          import json
          import math
          from pathlib import Path

          result = json.loads(Path("protocol-benchmark.json").read_text())
          assert result.get("benchmark") == "protocol_frame_1400"
          assert result.get("iterations") == 200000
          assert isinstance(result.get("encoded_bytes"), int) and result["encoded_bytes"] > 0
          assert isinstance(result.get("checksum"), int)
          for field in ("encode_mib_per_second", "decode_mib_per_second"):
              value = result.get(field)
              assert isinstance(value, (int, float)) and math.isfinite(value) and value > 0
          PY
          {
            echo '### Protocol microbenchmark (smoke result; not tunnel throughput)'
            echo
            echo '```json'
            cat protocol-benchmark.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  windows-client:
    name: Windows desktop client package
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B out/ci-windows-client -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DVCPKG_INSTALLED_DIR="$env:GITHUB_WORKSPACE/out/ci-windows-client/vcpkg_installed"
          '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'
          -DPERSONAL_VPN_BUILD_LINUX_TRANSPORT=OFF
          -DPERSONAL_VPN_BUILD_CLIENT_TRANSPORT=ON
          -DPERSONAL_VPN_BUILD_WINDOWS_UI=ON
          -DPERSONAL_VPN_FETCH_WINTUN=ON
      - name: Build and test
        shell: pwsh
        run: |
          cmake --build out/ci-windows-client --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir out/ci-windows-client -C Release --output-on-failure --timeout 30
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise broker installer lifecycle
        shell: pwsh
        run: |
          $build = Join-Path $env:GITHUB_WORKSPACE 'out/ci-windows-client'
          $broker = Get-ChildItem -Path $build -Recurse -Filter 'personal-vpn-broker-service.exe' |
            Where-Object FullName -NotLike '*\_deps\*' | Select-Object -First 1
          $client = Get-ChildItem -Path $build -Recurse -Filter 'personal-vpn-client.exe' |
            Select-Object -First 1
          $failureFixture = Get-ChildItem -Path $build -Recurse -Filter 'broker_service_failure_fixture.exe' |
            Select-Object -First 1
          if (-not $broker -or -not $client -or -not $failureFixture) {
            throw 'Windows broker integration test executables were not built'
          }
          $wintun = Join-Path $client.DirectoryName 'wintun.dll'
          if (-not (Test-Path -LiteralPath $wintun -PathType Leaf)) {
            throw "Built client is missing adjacent Wintun DLL: $wintun"
          }
          & tests/windows_broker_installer_integration.ps1 `
            -BrokerExecutable $broker.FullName `
            -ClientExecutable $client.FullName `
            -WintunDll $wintun `
            -FailureServiceExecutable $failureFixture.FullName
      - name: Verify package
        timeout-minutes: 5
        shell: pwsh
        run: |
          Write-Host 'Building Windows ZIP package'
          cmake --build out/ci-windows-client --config Release --target package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = Get-ChildItem out/ci-windows-client -Filter 'personal-vpn-*.zip' | Select-Object -First 1
          if (-not $package) { throw 'Windows client ZIP package was not created' }
          Write-Host 'Checking Windows ZIP contents'
          cmake "-DPACKAGE_ARCHIVE=$($package.FullName)" -P cmake/verify-windows-package.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sbomRoot = Join-Path $env:GITHUB_WORKSPACE 'out/ci-windows-client/vcpkg_installed'
          if (-not (Test-Path -LiteralPath $sbomRoot -PathType Container)) { throw "vcpkg installed tree missing: $sbomRoot" }
          $sbomShare = Join-Path $sbomRoot 'x64-windows-static/share'
          if (-not (Test-Path -LiteralPath $sbomShare -PathType Container)) { throw "vcpkg SBOM directory missing: $sbomShare" }
          $sbom = Get-ChildItem -Path $sbomShare -Directory |
            ForEach-Object { Join-Path $_.FullName 'vcpkg.spdx.json' } |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $sbom) { throw "vcpkg SPDX SBOM was not created under $sbomRoot" }
          $package | Format-List FullName, Length
      - name: Exercise dual-stack WFP runtime policy
        timeout-minutes: 5
        shell: pwsh
        run: |
          $build = Join-Path $env:GITHUB_WORKSPACE 'out/ci-windows-client'
          $test = Get-ChildItem -Path $build -Recurse -Filter 'windows_kill_switch_runtime_tests.exe' |
            Select-Object -First 1
          if (-not $test) { throw 'Windows WFP runtime integration test was not built' }
          $env:PERSONAL_VPN_RUN_WFP_INTEGRATION = '1'
          $stdout = Join-Path $env:RUNNER_TEMP 'windows-wfp-runtime.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'windows-wfp-runtime.stderr.log'
          $process = Start-Process -FilePath $test.FullName -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(90000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout }
            if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr }
            Write-Warning 'WFP integration timed out; removing persistent test policy'
            $cleanup = Start-Process -FilePath $test.FullName -ArgumentList '--cleanup' `
              -PassThru -NoNewWindow
            if (-not $cleanup.WaitForExit(30000)) {
              Stop-Process -Id $cleanup.Id -Force -ErrorAction SilentlyContinue
              throw 'WFP integration timed out and policy cleanup also timed out'
            }
            if ($cleanup.ExitCode -ne 0) { throw 'WFP integration timed out and policy cleanup failed' }
            throw 'WFP integration exceeded 90 seconds; persistent test policy was removed'
          }
          if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout }
          if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
