name: CodeQL

on:
  push:
    branches: [master, codex/enterprise-upgrade]
  pull_request:
    branches: [master]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-cpp:
    name: Analyze C++
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libboost-dev libssl-dev
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build analyzed targets
        run: |
          cmake -S . -B out/codeql -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPERSONAL_VPN_WARNINGS_AS_ERRORS=ON
          cmake --build out/codeql --parallel 2
      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
